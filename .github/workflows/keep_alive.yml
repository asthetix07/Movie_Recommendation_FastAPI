name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # lets you run it manually to test

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Open app and wake if sleeping
        env:
          APP_URL: https://cinewatch-vercel.streamlit.app/
        run: |
          python - <<'EOF'
          import os, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded")
              page.wait_for_timeout(5000)

              btn = page.get_by_role("button", name=re.compile("get this app back up", re.I))
              if btn.count() > 0:
                  btn.first.click()
                  print("App was asleep, clicked wake button.")
                  page.wait_for_timeout(30000)
              else:
                  print("No wake button found, app is already awake.")
                  page.wait_for_timeout(10000)

              browser.close()
          EOF
