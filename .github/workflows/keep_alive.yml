name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours to prevent Streamlit Community Cloud from sleeping
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # Replace the URL below with your actual Streamlit Cloud URL
          curl -s -L "https://cinewatch-vercel.streamlit.app" > /dev/null
          echo "Streamlit app pinged successfully at $(date)"
