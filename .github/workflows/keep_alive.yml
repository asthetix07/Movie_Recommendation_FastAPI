name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Resume Streamlit app
        shell: bash
        run: |
          set -u

          app_url="https://cinewatch-vercel.streamlit.app"
          resume_url="$app_url/api/v2/app/resume"
          cookie_jar="/tmp/streamlit-cookies.txt"
          machine_id="$(cat /proc/sys/kernel/random/uuid)"

          response_file="/tmp/streamlit-response.txt"

          http_code="$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --url "$resume_url" \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --connect-timeout 30 \
              --max-time 60 \
              --retry 3 \
              --retry-delay 5 \
              --cookie "$cookie_jar" \
              --cookie-jar "$cookie_jar" \
              --header "accept: application/json, text/plain, */*" \
              --header "content-length: 0" \
              --header "origin: $app_url" \
              --header "referer: $app_url/" \
              --header "x-streamlit-machine-id: $machine_id" \
              --data-binary ""
          )"

          echo "Resume endpoint returned HTTP $http_code"
          cat "$response_file"
          echo

          if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
            echo "Streamlit app resumed successfully at $(date -u)"
          else
            echo "Streamlit resume request failed with HTTP $http_code" >&2
            exit 1
          fi
